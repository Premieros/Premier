name: One-time functional dashboard hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic dashboard hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/dashboard/pages/DashboardFoodicsPage.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '/* AUDIT-FIX-2026 */'
          if marker not in text:
              text = text.replace(
                  "const [range,setRange]=useState<Range>('today');const [branchId,setBranchId]=useState('');",
                  "const [range,setRange]=useState<Range>('today');const [branchId,setBranchId]=useState('');const [compareEnabled,setCompareEnabled]=useState(false);const [filterOpen,setFilterOpen]=useState(false);const [orderTypeFilter,setOrderTypeFilter]=useState('');"
              )
              text = text.replace(
                  "const current=useMemo(()=>summarize(sales),[sales]);const previous=useMemo(()=>summarize(previousSales),[previousSales]);",
                  "const filteredSales=useMemo(()=>orderTypeFilter?sales.filter(r=>String(r.order_type||'').toLowerCase()===orderTypeFilter):sales,[sales,orderTypeFilter]);const current=useMemo(()=>summarize(filteredSales),[filteredSales]);const previous=useMemo(()=>summarize(previousSales),[previousSales]);"
              )
              text = text.replace(
                  "sales.forEach(r=>{const k=key(new Date(r.created_at),w.start);",
                  "filteredSales.forEach(r=>{const k=key(new Date(r.created_at),w.start);",
                  1
              )
              text = text.replace(
                  "},[sales,previousSales,range,ar]);",
                  "},[filteredSales,previousSales,range,ar]);"
              )
              text = text.replace("sales.forEach(r=>{const k=(r.payment_method||'other').toLowerCase();", "filteredSales.forEach(r=>{const k=(r.payment_method||'other').toLowerCase();")
              text = text.replace("},[sales]);", "},[filteredSales]);", 1)
              text = text.replace("sales.forEach(r=>{const b=r.branch?.[0];", "filteredSales.forEach(r=>{const b=r.branch?.[0];")
              text = text.replace("},[sales,ar]);", "},[filteredSales,ar]);")
              text = text.replace("const recent=sales.slice(0,4);", "const recent=filteredSales.slice(0,4);")
              text = text.replace('to="/reports?reportType=sales_by_branch"', 'to="/branches"')
              text = text.replace(
                  "<button className=\"inline-flex h-11 items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-sm font-semibold\"><span className=\"h-5 w-9 rounded-full bg-slate-200 p-0.5\"><span className=\"block h-4 w-4 rounded-full bg-white shadow\"/></span>{ar?'مقارنة':'Compare'}</button>",
                  "<button onClick={()=>setCompareEnabled(v=>!v)} aria-pressed={compareEnabled} className={`inline-flex h-11 items-center gap-2 rounded-xl border px-4 text-sm font-semibold ${compareEnabled?'border-[#5b2bd8] bg-[#f6f2ff] text-[#5b2bd8]':'border-slate-200 bg-white'}`}><span className={`h-5 w-9 rounded-full p-0.5 ${compareEnabled?'bg-[#5b2bd8]':'bg-slate-200'}`}><span className={`block h-4 w-4 rounded-full bg-white shadow transition ${compareEnabled?'translate-x-4':''}`}/></span>{ar?'مقارنة':'Compare'}</button>"
              )
              text = text.replace(
                  "<button className=\"inline-flex h-11 items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-sm font-semibold\"><Filter className=\"h-4 w-4\"/>{ar?'فلترة':'Filter'}</button>",
                  "<div className=\"relative\"><button onClick={()=>setFilterOpen(v=>!v)} aria-expanded={filterOpen} className=\"inline-flex h-11 items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-sm font-semibold\"><Filter className=\"h-4 w-4\"/>{ar?'فلترة':'Filter'}</button>{filterOpen&&<div className=\"absolute end-0 top-12 z-30 w-64 rounded-xl border border-slate-200 bg-white p-3 shadow-xl\"><p className=\"mb-2 text-xs font-bold text-slate-500\">{ar?'نوع الطلب':'Order type'}</p>{[['','الكل','All'],['dine_in','الصالة','Dine-in'],['takeaway','تيك أواي','Takeaway'],['delivery','دليفري','Delivery'],['car','سيارة','Car']].map(([value,arLabel,enLabel])=><button key={value} onClick={()=>{setOrderTypeFilter(value);setFilterOpen(false)}} className={`block w-full rounded-lg px-3 py-2 text-start text-sm ${orderTypeFilter===value?'bg-[#f1ecff] font-bold text-[#5b2bd8]':'hover:bg-slate-50'}`}>{ar?arLabel:enLabel}</button>)}</div>}</div>"
              )
              text = text.replace(
                  "<Area type=\"monotone\" dataKey=\"previous\" stroke=\"#b7a5eb\" strokeWidth={2} strokeDasharray=\"6 5\" fill=\"none\"/>",
                  "{compareEnabled&&<Area type=\"monotone\" dataKey=\"previous\" stroke=\"#b7a5eb\" strokeWidth={2} strokeDasharray=\"6 5\" fill=\"none\"/>}"
              )
              text = text.replace("export function DashboardFoodicsPage(){", "export function DashboardFoodicsPage(){\n /* AUDIT-FIX-2026 */")
              path.write_text(text, encoding='utf-8')

          test = Path('tests/unit/navigationRegression.test.ts')
          t = test.read_text(encoding='utf-8')
          t = t.replace("    expect(source).toContain('to=\"/reports?reportType=sales_by_branch\"');\n", "")
          if "expect(source).toContain('setCompareEnabled" not in t:
              t = t.replace("    expect(source).toContain('to=\"/inventory\"');", "    expect(source).toContain('to=\"/inventory\"');\n    expect(source).toContain('setCompareEnabled');\n    expect(source).toContain('setFilterOpen');")
          test.write_text(t, encoding='utf-8')

      - name: Commit hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hardening changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/dashboard/pages/DashboardFoodicsPage.tsx tests/unit/navigationRegression.test.ts
          git commit -m "fix: harden dashboard filters and navigation"
          git push
